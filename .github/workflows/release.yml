name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux (deb, rpm, AppImage, tar.xz)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            appstream

      - name: Validar metadados AppStream
        run: appstreamcli validate --no-net packaging/simion.appdata.xml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build deb and rpm
        shell: bash
        run: |
          curl -fsSL -o /tmp/nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          chmod +x /tmp/nfpm
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          for pair in "deb amd64" "rpm x86_64"; do
            set -- $pair
            sed -e "s|\${VERSION}|${VERSION}|g" -e "s|\${ARCH}|$2|g" \
              packaging/nfpm.yaml > "/tmp/nfpm-$1.yaml"
            /tmp/nfpm package -f "/tmp/nfpm-$1.yaml" -p "$1" -t dist
          done

      - name: Smoke do deb e rpm (AppStream)
        shell: bash
        run: |
          dpkg-deb -c dist/*.deb | grep -q 'usr/share/metainfo/simion.appdata.xml' \
            || { echo "✗ .deb sem simion.appdata.xml" >&2; exit 1; }
          if command -v rpm >/dev/null 2>&1; then
            rpm -qlp dist/*.rpm | grep -q 'usr/share/metainfo/simion.appdata.xml' \
              || { echo "✗ .rpm sem simion.appdata.xml" >&2; exit 1; }
          else
            bsdtar -tf dist/*.rpm | grep -q 'usr/share/metainfo/simion.appdata.xml' \
              || { echo "✗ .rpm sem simion.appdata.xml" >&2; exit 1; }
          fi

      - name: AppImage
        shell: bash
        run: |
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          PATH="/tmp:${PATH}" APPIMAGE_EXTRACT_AND_RUN=1 \
            bash packaging/make-appimage.sh "${{ steps.version.outputs.version }}"

      - name: Tarball
        shell: bash
        run: bash packaging/make-tarball.sh "${{ steps.version.outputs.version }}"

      - name: Smoke do instalador (tarball)
        shell: bash
        run: |
          sh -n packaging/install-tarball.sh
          bash packaging/ci-install-smoke.sh \
            "dist/simion_${{ steps.version.outputs.version }}_linux_x86_64.tar.xz"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  instalador-arch:
    # O relato da #27 veio do CachyOS: roda o mesmo smoke num Arch de verdade,
    # com o tarball do artifact (não da release). Não publica nada.
    name: Instalador no Arch Linux
    needs: [linux]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependências
        run: pacman -Syu --noconfirm --needed tar xz coreutils bash

      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist

      - name: Smoke do instalador
        shell: bash
        run: |
          tarball="$(ls dist/simion_*_linux_x86_64.tar.xz | head -n1)"
          bash packaging/ci-install-smoke.sh "$tarball"

  windows:
    name: Windows (MSI, zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install WiX and cargo-wix
        shell: pwsh
        run: |
          # WiX 5/6 como dotnet tool: um binário (wix) + extensão UI instalada
          # pela própria CLI. Não usamos mais o choco/`cargo wix init`, porque o
          # template gerado por `init` não cria atalho nem pacotes de UI (#1).
          dotnet tool install --global wix --version 6.*
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # O call operator (&) é obrigatório: um caminho entre aspas não pode
          # receber argumentos ("...wix.exe" extension add -> ParserError).
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.UI.wixext/6.0.2

      - name: Build MSI and zip
        shell: pwsh
        run: |
          # .wxs versionado no repositório: atalhos do Menu Iniciar/Desktop,
          # ícone em Apps instalados e escolha de diretório (#1, #2, #3).
          wix build wix\main.wxs `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -d CargoTargetBinDir=target\release `
            -d Version=${{ steps.version.outputs.version }} `
            -o "dist\Simion-Setup-${{ steps.version.outputs.version }}-x64.msi"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Force `
            -Path target\release\simion.exe, README.md, LICENSE, assets\branding\simion.ico `
            -DestinationPath "dist\simion_${{ steps.version.outputs.version }}_windows_x64.zip"

      - name: Verificar conteúdo do MSI
        shell: pwsh
        run: |
          # Prova, no próprio runner, que o atalho entrou no pacote. No WiX 6
          # não existe mais `dark.exe`: o decompilador é `wix msi decompile`.
          $msi = "dist\Simion-Setup-${{ steps.version.outputs.version }}-x64.msi"
          $dump = Join-Path $env:RUNNER_TEMP "wixdump"
          New-Item -ItemType Directory -Force -Path $dump | Out-Null
          wix msi decompile $msi -o (Join-Path $dump "msi.wxs")
          $shortcuts = Select-String -Path (Join-Path $dump "msi.wxs") -Pattern "Shortcut"
          if (-not $shortcuts) {
            Write-Error "O MSI nao contem nenhum atalho: a issue #1 regrediu"
            exit 1
          }
          Write-Host "Atalhos no MSI:"
          $shortcuts | ForEach-Object { $_.Line.Trim() }

          # O atalho sem icone (#7) passou porque o CI so olhava "Shortcut".
          # Agora exige tambem o Icon do produto e o AppUserModelID nos atalhos.
          $icon = Select-String -Path (Join-Path $dump "msi.wxs") -Pattern 'Icon Id="ProductICO"'
          if (-not $icon) {
            Write-Error "O MSI nao embutiu o icone do produto: a issue #7 regrediu"
            exit 1
          }
          $aumid = Select-String -Path (Join-Path $dump "msi.wxs") -Pattern "System.AppUserModel.ID"
          if (-not $aumid) {
            Write-Error "Os atalhos nao declaram System.AppUserModel.ID: a issue #7 regrediu"
            exit 1
          }
          Write-Host "Icone do produto e AppUserModelID presentes no MSI."

      - name: Instalar MSI e validar atalho
        shell: pwsh
        run: |
          $msi = (Resolve-Path "dist\Simion-Setup-${{ steps.version.outputs.version }}-x64.msi").Path
          $log = Join-Path $env:RUNNER_TEMP "simion-install.log"
          $proc = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$log`"") -Wait -PassThru
          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
            Get-Content $log -Tail 200
            throw "MSI install failed: $($proc.ExitCode)"
          }
          $exe = Join-Path $env:ProgramFiles 'Simion\simion.exe'
          if (-not (Test-Path $exe)) { throw "simion.exe nao instalado em $exe" }

          $shortcuts = @(
            (Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'Simion.lnk'),
            (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Simion\Simion.lnk')
          )
          $shell = New-Object -ComObject WScript.Shell
          foreach ($lnkPath in $shortcuts) {
            if (-not (Test-Path $lnkPath)) { throw "atalho ausente: $lnkPath" }
            $lnk = $shell.CreateShortcut($lnkPath)
            Write-Host "Atalho: $lnkPath"
            Write-Host "  TargetPath: $($lnk.TargetPath)"
            Write-Host "  IconLocation: $($lnk.IconLocation)"
            if ($lnk.TargetPath -ne $exe) {
              throw "atalho nao aponta para simion.exe: $($lnk.TargetPath)"
            }
          }

          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw "simion.exe sem icone extraivel" }
          $bmp = $icon.ToBitmap()
          $center = $bmp.GetPixel([int]($bmp.Width / 2), [int]($bmp.Height / 2))
          Write-Host "Icone extraido: $($bmp.Width)x$($bmp.Height), alpha centro=$($center.A)"
          if ($center.A -eq 0) { throw "icone do simion.exe saiu transparente no centro" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (DMG universal)
    # macOS 14 foi aposentado em 02/11/2026; macos-15 ainda é arm64 e roda o
    # build universal (x86_64 + aarch64) com o mesmo lipo.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build universal
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p build
          lipo -create \
            -output build/Simion \
            target/aarch64-apple-darwin/release/simion \
            target/x86_64-apple-darwin/release/simion
          file build/Simion

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: DMG and app zip
        run: bash packaging/macos/make-dmg.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, instalador-arch, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Descartar artefatos que nao vao para o release
        run: |
          # .wixpdb sao simbolos de depuracao do WiX: poluem a lista de assets e
          # nao servem para quem baixa o app (issue #5).
          find dist -name '*.wixpdb' -delete
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Simion ${{ github.ref_name }}
          body: |
            ## Instalacao

            - **Windows**: baixe `Simion-Setup-<versao>-x64.msi` e de **duplo clique**
              (nao existe `setup.exe`: o instalador e o `.msi`).
            - **macOS**: `Simion-<versao>-universal.dmg`.
            - **Linux**: `.AppImage`, `.deb`, `.rpm` ou `.tar.xz` portátil (extraia e rode
              `./install.sh` de dentro da pasta). No Arch/CachyOS use o AppImage ou o `.tar.xz`.

            As builds nao sao assinadas (`#5`), entao o SmartScreen/Gatekeeper pode pedir confirmacao.
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

[package]
name = "simion"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Um caderno de blocos local, leve e bonito — um clone do Notion em Rust"
license = "MIT"
authors = ["Cleison Santos"]
repository = "https://github.com/cleisonsantos/simion"
homepage = "https://github.com/cleisonsantos/simion"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "clipboard"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

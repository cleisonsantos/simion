[package]
name = "simion"
version = "0.1.12"
edition = "2024"
rust-version = "1.95"
description = "Um caderno de blocos local, leve e bonito — um clone do Notion em Rust"
license = "MIT"
authors = ["Cleison Santos"]
repository = "https://github.com/cleisonsantos/simion"
homepage = "https://github.com/cleisonsantos/simion"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11", "clipboard"] }
# Decodifica o PNG da marca para o icone da janela (ver src/icon.rs, #2).
# `png` ja esta na arvore via eframe; declarar aqui evita depender de reexport.
png = { version = "0.18", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy", "regex-fancy", "parsing", "html", "plist-load", "yaml-load", "dump-load"] }
ureq = { version = "3.5.1", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
